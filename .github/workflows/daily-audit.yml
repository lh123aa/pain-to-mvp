name: Daily Audit

# OPEN_ISSUES #14 处置记录（2026-10-15）：PRD §三（Q3）决策「自优化不投入」，
# 原 cron 定时 + auto commit&push 与该决策冲突 → 去定时改仅手动触发，
# 且审计结果只上传 artifact 不再自动提交推送（与 self-heal.yml 只读原则一致）。
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pyyaml
      - name: Run audit
        run: python scripts/self_improve/audit_runner.py
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            data/audit/**
            docs/audit/**
          if-no-files-found: ignore
