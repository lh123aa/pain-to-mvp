name: Self-Heal

# 注意：本工作流已改为"手动触发的只读诊断"。原实现每天定时自动
# commit & push 虚假修复（不改代码却标记 fixed），已废弃。
# 真正的修复由人执行；此 workflow 仅用于在 CI 环境跑一次诊断并留存报告。
on:
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run self-heal diagnosis (read-only)
        run: python scripts/healing/heal_runner.py
      - name: Upload heal report
        uses: actions/upload-artifact@v4
        with:
          name: heal-report
          path: data/bugs/heal-report.md
          if-no-files-found: warn
